name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Compila, roda testes unitários e de integração (Testcontainers usa o Docker do runner).
      - name: Build e testes
        run: ./gradlew build

      - name: Relatório de testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

      - name: Build da imagem Docker
        run: docker build -t product-activation-service:${{ github.sha }} .
