services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: activation
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activation"]
      interval: 5s
      timeout: 3s
      retries: 10

  provider-mock:
    image: wiremock/wiremock:3.13.2
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "8089:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock:ro

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      provider-mock:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/activation
      DB_USERNAME: activation
      DB_PASSWORD: activation
      PROVIDER_BASE_URL: http://provider-mock:8080
      # Apenas para ambiente local: valida tokens HS256 gerados por scripts/generate-token.sh.
      ACTIVATION_SECURITY_LOCALJWT_HMACSECRET: local-dev-secret-change-me-at-least-32-bytes
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    stop_grace_period: 30s
