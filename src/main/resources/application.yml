spring:
  application:
    name: product-activation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/activation}
    username: ${DB_USERNAME:activation}
    password: ${DB_PASSWORD:activation}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Produção: emissor OAuth 2.0 (ex.: Keycloak, Entra ID, Cognito). As chaves vêm do JWKS dele.
          issuer-uri: ${OAUTH2_ISSUER_URI:}
          audiences: ${OAUTH2_AUDIENCE:product-activation-service}

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

activation:
  provider:
    base-url: ${PROVIDER_BASE_URL:http://localhost:8089}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:5s}
  worker:
    enabled: ${WORKER_ENABLED:true}
    poll-interval: 2s
    batch-size: 20
    max-attempts: 5
    base-backoff: 2s
    max-backoff: 5m
    stuck-timeout: 2m
    stuck-check-interval: 30s
  security:
    local-jwt:
      # hmac-secret só é definido no ambiente local (variável ACTIVATION_SECURITY_LOCALJWT_HMACSECRET).
      # Em produção fica ausente e a validação usa o issuer-uri acima.
      issuer: local-issuer
      audience: product-activation-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        activation.provider.calls: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
